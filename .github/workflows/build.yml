name: Build Ordoo Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # الإصدار يُقرأ من packageManager في package.json (pnpm@12.4.2)
      # — تحديد version هنا يُفشل الخطوة بتعارض «Multiple versions of pnpm»
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ordoo Agent ${{ github.ref_name }}'
          releaseBody: 'Ordoo Agent Desktop Print Application'
          # منشور (لا مسودة) حتى تُنزَّل ملفاته بلا مصادقة من أي بيئة
          releaseDraft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # الإصدار يُقرأ من packageManager في package.json (pnpm@12.4.2)
      # — تحديد version هنا يُفشل الخطوة بتعارض «Multiple versions of pnpm»
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ordoo Agent ${{ github.ref_name }}'
          releaseBody: 'Ordoo Agent Desktop Print Application'
          # منشور (لا مسودة) حتى تُنزَّل ملفاته بلا مصادقة من أي بيئة
          releaseDraft: false
          prerelease: false
