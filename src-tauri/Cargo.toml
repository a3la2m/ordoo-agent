[package]
name = "ordoo-agent"
version = "0.1.0"
description = "Ordoo Agent - Desktop Print Agent"
authors = ["Ordoo"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

# Serialization
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Machine Identity
machine-uid = "0.5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Encryption / Hashing
sha2 = "0.10"
hex = "0.4"

# Retry / Backoff
backon = "1"

# Printer (ESC/POS)
escposify = "0.3"

# Logging to file
simplelog = "0.12"

# Channel
crossbeam-channel = "0.5"

# Regex (for printer discovery)
regex = "1"

# Platform dirs
dirs = "5"

# Hostname
hostname = "0.4"

# Image processing (for tray icon)
image = "0.25"
